<style>
  /* Layout: one narrow column built for a phone held in one hand; scan button first, result card below. */
  :root {
    --bg: #f2f0ea; --surface: #ffffff; --fg: #1e1f1a; --muted: #6b6a5f; --line: #dcd9cf;
    --accent: #7a5a2b; --accent-fg: #ffffff; --good: #2f6b3a; --bad: #b3261e; --warn-bg: #fbeee0;
    --display: "Barlow Condensed", "Arial Narrow", sans-serif;
    --body: "Barlow", system-ui, -apple-system, sans-serif;
    --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg: #16170f; --surface: #22231b; --fg: #ecebe3; --muted: #a09e90; --line: #36372c;
    --accent: #c99a5b; --accent-fg: #16170f; --good: #7cc48a; --bad: #ff8a80; --warn-bg: #3a2c1c; color-scheme: dark } }
  :root[data-theme="dark"] {
    --bg: #16170f; --surface: #22231b; --fg: #ecebe3; --muted: #a09e90; --line: #36372c;
    --accent: #c99a5b; --accent-fg: #16170f; --good: #7cc48a; --bad: #ff8a80; --warn-bg: #3a2c1c; color-scheme: dark }

  * { box-sizing: border-box; }
  body { background: var(--bg); color: var(--fg); font: 16px/1.4 var(--body);
    padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 32px; }
  main { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
  header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  h1 { font: 700 28px/1 var(--display); letter-spacing: .02em; text-transform: uppercase; margin: 0; }
  .synced { font: 12px var(--mono); color: var(--muted); }

  .scan { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 22px 16px;
    background: var(--accent); color: var(--accent-fg); border: 0; border-radius: 14px; cursor: pointer;
    font: 700 24px/1 var(--display); letter-spacing: .06em; text-transform: uppercase; }
  .scan:focus-visible, input:focus-visible, .hit:focus-visible, #camClose:focus-visible { outline: 3px solid var(--fg); outline-offset: 2px; }
  .scan svg { width: 30px; height: 30px; }
  #photo { position: absolute; width: 1px; height: 1px; opacity: 0; pointer-events: none; }

  #q { width: 100%; padding: 14px; font: 16px var(--body); color: var(--fg); background: var(--surface);
    border: 1px solid var(--line); border-radius: 12px; }
  #status { min-height: 20px; color: var(--muted); font-size: 14px; }
  #status.err { color: var(--bad); }

  .card { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 18px; display: flex; flex-direction: column; gap: 14px; }
  .card.miss { background: var(--warn-bg); }
  .name { font: 600 22px/1.15 var(--display); letter-spacing: .01em; text-wrap: balance; margin: 0; }
  .stock { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .stock div { border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
  .stock b { display: block; font: 700 40px/1 var(--display); font-variant-numeric: tabular-nums; }
  .stock span { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
  .stock .out b { color: var(--bad); }
  .stock .in b { color: var(--good); }
  dl { margin: 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 14px; }
  dt { color: var(--muted); }
  dd { margin: 0; font-family: var(--mono); overflow-wrap: anywhere; }

  .hits { display: flex; flex-direction: column; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .hit { display: flex; justify-content: space-between; gap: 12px; padding: 12px 14px; border: 0; border-top: 1px solid var(--line);
    background: none; color: var(--fg); text-align: left; font: 15px var(--body); cursor: pointer; }
  .hit:first-child { border-top: 0; }
  .hit .n { min-width: 0; }
  .hit small { display: block; font: 12px var(--mono); color: var(--muted); }
  .hit .a { font: 700 20px var(--display); font-variant-numeric: tabular-nums; }
  .hit .a.zero { color: var(--bad); }
  .note { font-size: 13px; color: var(--muted); }
  #reader { display: none; }
  #out { display: flex; flex-direction: column; gap: 12px; }
  #cam { position: fixed; inset: 0; z-index: 20; background: #000; display: flex; flex-direction: column; justify-content: center;
    padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px); }
  #cam[hidden] { display: none !important; }
  #live { width: 100%; }
  #live video { width: 100% !important; height: auto !important; }
  .cam-hint { color: #fff; text-align: center; font: 500 16px var(--body); margin: 14px 0; }
  #camClose { position: absolute; right: calc(16px + env(safe-area-inset-right, 0px)); bottom: calc(24px + env(safe-area-inset-bottom, 0px));
    left: calc(16px + env(safe-area-inset-left, 0px)); padding: 16px; border: 0; border-radius: 12px; background: #fff; color: #000;
    font: 700 20px var(--display); letter-spacing: .06em; text-transform: uppercase; cursor: pointer; }
</style>

  <div id="out"></div>
  <p class="note" id="about"></p>
  <div id="reader"></div>
</main>

<div id="cam" hidden>

</div>

",9,9,"35.00"],[["398-02005000"],"398-02005000","Women’s USA Performance Tank Ranger Green Camo / S",7,7,"35.00"],[["398-05005000"],"398-05005000","Women’s USA Performance Tank Ranger Green Camo / XL",0,0,"35.00"],[["398-06005000"],"398-06005000","Women’s USA Performance Tank Ranger Green Camo / XXL",0,0,"35.00"],[["408-04000100"],"408-04000100","XL / XXL ONLY - Men's USA Sun Hoodie - Full-Zip - ToughMesh L",0,0,"135.00"],[["408-03000100"],"408-03000100","XL / XXL ONLY - Men's USA Sun Hoodie - Full-Zip - ToughMesh M",0,0,"135.00"],[["408-02000100"],"408-02000100","XL / XXL ONLY - Men's USA Sun Hoodie - Full-Zip - ToughMesh S",0,0,"135.00"],[["408-05000100"],"408-05000100","XL / XXL ONLY - Men's USA Sun Hoodie - Full-Zip - ToughMesh XL",7,7,"115.00"],[["408-06000100"],"408-06000100","XL / XXL ONLY - Men's USA Sun Hoodie - Full-Zip - ToughMesh XXL",29,30,"115.00"],[["766430345"],"381512","XPT Ruck A Marathon Anti-Virtual Challenge",70,70,"25.00"],[[],"320905-YM","Youth T-Shirt - K9s United 2025 (Size: M)",3,3,""],[[],"320905-YS","Youth T-Shirt - K9s United 2025 (Size: S)",3,3,""],[[],"320905-YXS","Youth T-Shirt - K9s United 2025 (Size: XS)",4,4,""],[[],"840360208995","test inventory do not use",3,3,"175.00"]],"logUrl":"https://script.google.com/macros/s/AKfycbzkOkZ9zAgR47hbQuRfC0xd1Lb7CxgZM2ocBgyRZP_TlG8WuCX5yT0qTK8QTG0MLndb/exec"};
// rows: [barcodes[], sku, name, available, onHand, price]

const norm = s => String(s || '').trim().toUpperCase().replace(/^0+/, '');
// code → row indexes; barcode matches go before SKU matches, since a few ShipHero SKUs reuse another item's UPC.
const index = new Map();
const add = (c, i) => { const k = norm(c); if (!k) return; const l = index.get(k) || []; if (!l.includes(i)) l.push(i); index.set(k, l); };
DATA.rows.forEach((r, i) => r[0].forEach(c => add(c, i)));
DATA.rows.forEach((r, i) => add(r[1], i));

const $ = id => document.getElementById(id);
const out = $('out'), statusEl = $('status');
const fmt = n => n.toLocaleString('en-US');
$('synced').textContent = 'ShipHero · ' + DATA.synced;
$('about').textContent = fmt(DATA.rows.length) + ' SKUs (ShipHero stock plus out-of-stock Shopify items), ' + fmt(DATA.withBarcode) +
  ' with a barcode. Stock is a snapshot from ' + DATA.synced + ', not live.';

function setStatus(msg, err) { statusEl.textContent = msg || ''; statusEl.className = err ? 'err' : ''; }
function esc(s) { return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function cards(list) { out.innerHTML = list.map(cardHtml).join(''); }

function cardHtml(i) {
  const [codes, sku, name, avail, onHand, price] = DATA.rows[i];
  return '<article class="card"><h2 class="name">' + esc(name) + '</h2>' +
    '<div class="stock"><div class="' + (avail > 0 ? 'in' : 'out') + '"><b>' + fmt(avail) + '</b><span>Available</span></div>' +
    '<div><b>' + fmt(onHand) + '</b><span>On hand</span></div></div>' +
    '<dl><dt>SKU</dt><dd>' + esc(sku) + '</dd>' +
    '<dt>Barcode</dt><dd>' + (codes.length ? codes.map(esc).join('<br>') : '—') + '</dd>' +
    (price ? '<dt>Price</dt><dd>$' + esc(price) + '</dd>' : '') + '</dl></article>';
}

function miss(code) {
  out.innerHTML = '<article class="card miss"><h2 class="name">Not found</h2>' +
    '<dl><dt>Scanned</dt><dd>' + esc(code) + '</dd></dl>' +
    '<p class="note">This code is not a ShipHero SKU or the barcode of an active Shopify product.</p></article>';
}

function find(code, how) {
  const l = index.get(norm(code));
  if (!l) miss(code); else cards(l);
  if (how) logScan(code, l, how);
}

// Each scan (and each Enter in the search box) is sent to the Stock Scanner Log sheet.
// no-cors means the page cannot read the reply, so it reports "sent", not "saved".
function logScan(code, list, how) {
  if (!DATA.logUrl) return;
  // One scan = one unit: when a code matches several items, log only the first (the barcode match).
  const rows = list ? [list[0]].map(i => ({ code, sku: DATA.rows[i][1], name: DATA.rows[i][2],
    available: DATA.rows[i][3], onHand: DATA.rows[i][4], found: true, how }))
    : [{ code, sku: '', name: '', available: '', onHand: '', found: false, how }];
  rows.forEach(r => fetch(DATA.logUrl, { method: 'POST', mode: 'no-cors', headers: { 'Content-Type': 'text/plain' }, body: JSON.stringify(r) })
    .then(() => setStatus('Sent to log sheet'))
    .catch(() => setStatus('Could not reach the log sheet. This scan was not saved.', true)));
}

// Typing: exact barcode/SKU shows the card; anything else lists name matches.
$('q').addEventListener('input', e => {
  const q = e.target.value.trim();
  setStatus('');
  if (!q) { out.innerHTML = ''; return; }
  const exact = index.get(norm(q));
  if (exact) { cards(exact); return; }
  if (q.length < 2) { out.innerHTML = ''; return; }
  const words = q.toLowerCase().split(/\s+/);
  const hits = [];
  for (let i = 0; i < DATA.rows.length && hits.length < 25; i++) {
    const hay = (DATA.rows[i][2] + ' ' + DATA.rows[i][1]).toLowerCase();
    if (words.every(w => hay.includes(w))) hits.push(i);
  }
  out.innerHTML = hits.length
    ? '<div class="hits">' + hits.map(i => '<button class="hit" data-i="' + i + '"><span class="n">' + esc(DATA.rows[i][2]) +
        '<small>' + esc(DATA.rows[i][1]) + '</small></span><span class="a' + (DATA.rows[i][3] > 0 ? '' : ' zero') + '">' +
        fmt(DATA.rows[i][3]) + '</span></button>').join('') + '</div>'
    : '';
  if (!hits.length) setStatus('No match for "' + q + '"');
});
out.addEventListener('click', e => { const b = e.target.closest('.hit'); if (b) cards([+b.dataset.i]); });
$('q').addEventListener('keydown', e => { if (e.key === 'Enter') { e.preventDefault(); find(e.target.value, 'typed'); e.target.blur(); } });

// Scanning: live camera first; it closes itself as soon as it reads a barcode.
// Where the browser blocks the camera (e.g. inside the claude.ai viewer), Scan takes a photo instead.
function makeDecoder(el) {
  if (!window.Html5Qrcode) throw new Error('Scanner library did not load. Check the connection and reload.');
  const F = Html5QrcodeSupportedFormats;
  return new Html5Qrcode(el, { verbose: false,
    formatsToSupport: [F.EAN_13, F.UPC_A, F.UPC_E, F.EAN_8, F.CODE_128, F.CODE_39, F.QR_CODE],
    experimentalFeatures: { useBarCodeDetectorIfSupported: true } });
}
let decoder = null;
const getDecoder = () => decoder || (decoder = makeDecoder('reader'));

let live = null, photoMode = !(navigator.mediaDevices && navigator.mediaDevices.getUserMedia);
$('scanBtn').addEventListener('click', () => photoMode ? $('photo').click() : startLive());
$('camClose').addEventListener('click', () => stopLive());

async function startLive() {
  setStatus('');
  out.innerHTML = '';
  $('cam').hidden = false;
  try {
    live = live || makeDecoder('live');
    await live.start({ facingMode: 'environment' },
      { fps: 15, qrbox: (w, h) => ({ width: Math.floor(w * 0.85), height: Math.floor(Math.min(h, w) * 0.45) }) },
      code => { stopLive(); if (navigator.vibrate) navigator.vibrate(80); $('q').value = code; find(code, 'camera'); },
      () => {});
  } catch (err) {
    $('cam').hidden = true;
    photoMode = true;
    setStatus('Live camera is blocked in this browser. Tap Scan again to take a photo of the barcode.', true);
  }
}

async function stopLive() {
  $('cam').hidden = true;
  if (live && live.isScanning) { try { await live.stop(); live.clear(); } catch (_) {} }
}

function shrink(file, max) {
  return new Promise((resolve) => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, max / Math.max(img.width, img.height));
      if (s === 1) { resolve(file); return; }
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      c.toBlob(b => resolve(b ? new File([b], 'scan.jpg', { type: 'image/jpeg' }) : file), 'image/jpeg', 0.92);
      URL.revokeObjectURL(img.src);
    };
    img.onerror = () => resolve(file);
    img.src = URL.createObjectURL(file);
  });
}

$('photo').addEventListener('change', async e => {
  const file = e.target.files[0];
  e.target.value = '';
  if (!file) return;
  out.innerHTML = '';
  setStatus('Reading barcode…');
  try {
    const d = getDecoder();
    let code = null;
    for (const size of [1600, 2400]) {
      try { code = await d.scanFile(await shrink(file, size), false); break; } catch (_) {}
    }
    if (!code) { setStatus('No barcode found in that photo. Fill the frame with the barcode, hold steady, and try again.', true); return; }
    setStatus('');
    $('q').value = code;
    find(code, 'photo');
  } catch (err) {
    setStatus(err.message, true);
  }
});
</script>
